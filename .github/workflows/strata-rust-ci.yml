name: STRATA DongArch3D Rust CI (V1-V8 Harness)

# 새 저장소(kyi0109657401-hub/giga)로 이전하며 자동 실행을 다시 켠다.
# 이전 계정에서는 결제 문제로 push 마다 실패 기록이 쌓여 workflow_dispatch 로 막아두었었다.
on:
  push:
    branches: [master, main, "feat/**", "factory/**"]
    paths:
      - "strata-arch3d/**"
      - "docs/ui/**"
      - ".github/workflows/strata-rust-ci.yml"
  pull_request:
    branches: [master, main]
    paths:
      - "strata-arch3d/**"
      - "docs/ui/**"
      - ".github/workflows/strata-rust-ci.yml"
  workflow_dispatch:

concurrency:
  group: strata-rust-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # 릴리즈 프로파일(LTO fat·codegen-units=1)은 로컬 PC 기준 2~3분. CI 캐시가 없으면 더 축난다.
  CARGO_INCREMENTAL: "0"

jobs:
  rust-harness-verify:
    name: Rust 1.91.1 · fmt · Clippy (-D warnings) · V1-V8 Harness
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 저장소의 strata-arch3d/rust-toolchain.toml(channel 1.91.1, rustfmt·clippy)와
      # 로컬 개발 환경을 일치시킨다. toolchain 을 명시하지 않으면 CI 러너 기본 stable 로
      # 달라져 버전 차이로 깨질 수 있다.
      - name: Install pinned Rust toolchain (rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.91.1"
          components: rustfmt, clippy

      - name: Cache Cargo registry, git db and target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "strata-arch3d -> target"
          key: strata-rust-${{ hashFiles('strata-arch3d/Cargo.toml', 'strata-arch3d/.cargo/config.toml') }}

      - name: "[V1] Format + Check + Clippy zero warnings"
        working-directory: strata-arch3d
        run: |
          cargo fmt --all -- --check
          cargo check --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings

      # 타이밍 기반 테스트(프레임 예산)가 병렬 실행 시 흔들리므로 직렬로 돌린다.
      - name: "[V2-V7] Full workspace test suite (serial)"
        working-directory: strata-arch3d
        run: |
          cargo test --workspace --locked -- --nocapture --test-threads=1

      # 헤드리스 하네스 게이트(V1~V8) — 실패하면 파이프라인도 실패한다.
      - name: "[V8] Headless V1-V8 harness gate"
        working-directory: strata-arch3d
        run: |
          cargo run --release --locked -p strata-studio -- --verify-all

      # 화면 캡처는 GPU/디스플레이 문맥이 필요해 러너에서 실패할 수 있다.
      # 산출물은 남기되 파이프라인을 막지는 않는다.
      - name: "[V8-opt] Canonical UI/plate capture (non-blocking)"
        working-directory: strata-arch3d
        continue-on-error: true
        run: |
          $shotDir = "target/ci-shots"
          New-Item -ItemType Directory -Force -Path $shotDir | Out-Null
          cargo run --release --locked -p strata-studio -- --screenshot-tour "$shotDir"
          Get-ChildItem "$shotDir/*" -File | ForEach-Object {
            if ($_.Length -eq 0) { throw "Artifact $($_.Name) is empty" }
          }

      - name: Upload STRATA Rust verification artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: strata-arch3d-rust-verification
          retention-days: 14
          path: strata-arch3d/target/ci-shots/*
